name: keep-supabase-alive

on:
  schedule:
    - cron: "30 6 */3 * *"   # every 3 days at 06:30 UTC (12:00 PM IST)
  workflow_dispatch:        # allows manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (update keepalive row)
        run: |
          curl -sS -f --retry 3 --retry-delay 10 -X POST \
            "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/keepalive_ping" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}'
